site_name: HKL-PDF
site_description: Graphical pair distribution function fitting and crystallite-shape analysis
site_url: https://malaguttimarcelo.github.io/HKL-PDF/
repo_url: https://github.com/MalaguttiMarcelo/HKL-PDF
repo_name: MalaguttiMarcelo/HKL-PDF

theme:
  name: material

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quick-start.md
      - Graphical interface: gui.md
  - Files:
      - Project files (JSON): project-format.md
      - Input files (.inp): input-format.md
      - Parameter reference: parameters.md
  - Fitting:
      - Conventional fitting: conventional-fitting.md
      - Model equations: equations.md
      - Crystallite size: microcrystallin.md
      - Microstrain: microstrain.md
      - SAXS and missing low Q: saxs-model.md
      - Finite crystallite shapes: finite-shapes.md
      - Layer stacking and stacking faults: stacking-faults.md
      - Anisotropic ADPs: adp.md
      - Esds and correlations: uncertainties.md
      - Free-peak fit and widths per direction: free-peaks.md
  - Tools:
      - Structure editor: structure-editor.md
      - GPU acceleration and performance: gpu.md
  - Model reference:
      - Conventional: models/conventional.md
      - Spherical size: models/spherical-size.md
      - Cylinder and disk: models/cylinder-disk.md
      - SAXS belly: models/saxs-belly.md
      - Finite shape: models/finite-shape.md
      - Microstrain: models/microstrain.md
  - Troubleshooting: troubleshooting.md
  - Development:
      - Developer guide: developer-guide.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
